services:
  gateway-service:
    build:
      context: gateway-service
      dockerfile: Dockerfile
    volumes:
      - ./gateway-service:/app
    ports:
      - 3333:80
    env_file:
      - ./gateway-service/.env
    networks:
      - tdl
    depends_on:
      tasks-service:
        condition: service_started
      auth-service:
        condition: service_started
      message-broker:
        condition: service_healthy

  auth-service:
    build:
      context: auth-service
      dockerfile: Dockerfile
    volumes:
      - ./auth-service:/app
    ports:
      - 4000:80
    env_file:
      - ./auth-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

  tasks-service:
    build:
      context: tasks-service
      dockerfile: Dockerfile
    volumes:
      - ./tasks-service:/app
    ports:
      - 3000:80
    env_file:
      - ./tasks-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started

  # ws:
  #   image: node:alpine
  #   command: sh -c "npm i && npm run dev"
  #   working_dir: /usr/src/app
  #   volumes:
  #     - ./ws:/usr/src/app
  #   ports:
  #     - 3080:3000
  #   env_file:
  #     - ./ws/.env
  #   depends_on:
  #     message-broker:
  #       condition: service_healthy
  #   networks:
  #     - tdl

  message-broker:
    image: rabbitmq
    env_file:
      - ./message-broker/.env
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
    ports:
      - 5673:5672
      - 15673:15672
    volumes:
      - ./message-broker/data/:/var/lib/rabbitmq/
      - ./message-broker/log/:/var/log/rabbitmq
    networks:
      - tdl

  adminer:
    container_name: adminer
    image: adminer
    env_file:
      - ./adminer/.env
    ports:
      - 8080:8080
    networks:
      - tdl
  
  payment-service:
    build:
      context: payment-service
      dockerfile: Dockerfile
    volumes:
      - ./payment-service:/app
    ports:
      - 5000:80
    env_file:
      - ./payment-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

  postgres-db:
    image: postgres
    env_file:
      - ./postgres-db/.env
    volumes:
      - ./postgres-db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tdl
      
  odds-service:
    build:
      context: odds-service
      dockerfile: Dockerfile
    volumes:
      - ./odds-service:/app
    ports:
      - 2000:80
    env_file:
      - ./odds-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

  card-service:
    build:
      context: card-service
      dockerfile: Dockerfile
    volumes:
      - ./card-service:/app
    ports:
      - 4500:80
    env_file:
      - ./card-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy


  betting-service:
    build:
      context: betting-service
      dockerfile: Dockerfile
    volumes:
      - ./betting-service:/app
    ports:
      - 7000:80
    env_file:
      - ./betting-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

networks:
  tdl:
    driver: bridge
