services:
  gateway-service:
    build:
      context: gateway-service
      dockerfile: Dockerfile
    volumes:
      - ./gateway-service:/app
    ports:
      - 3333:80
    env_file:
      - ./gateway-service/.env
    networks:
      - tdl
    depends_on:
      auth-service:
        condition: service_started
      betting-service:
        condition: service_started
      bookmaker-service:
        condition: service_started
      card-service:
        condition: service_started
      customer-service:
        condition: service_started
      notification-service:
        condition: service_started
      odds-service:
        condition: service_started
      payment-service:
        condition: service_started
      message-broker:
        condition: service_healthy


  auth-service:
    build:
      context: auth-service
      dockerfile: Dockerfile
    volumes:
      - ./auth-service:/app
    ports:
      - 4000:80
    env_file:
      - ./auth-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

  message-broker:
    image: rabbitmq:3-management
    env_file:
      - ./message-broker/.env
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ./message-broker/data/:/var/lib/rabbitmq/
      - ./message-broker/log/:/var/log/rabbitmq
    networks:
      - tdl

  adminer:
    container_name: adminer
    image: adminer
    env_file:
      - ./adminer/.env
    ports:
      - 8080:8080
    networks:
      - tdl
  
  payment-service:
    build:
      context: payment-service
      dockerfile: Dockerfile
    volumes:
      - ./payment-service:/app
    ports:
      - 5000:80
    env_file:
      - ./payment-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

  postgres-db:
    image: postgres
    env_file:
      - ./postgres-db/.env
    volumes:
      - ./postgres-db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tdl
      
  odds-service:
    build:
      context: odds-service
      dockerfile: Dockerfile
    volumes:
      - ./odds-service:/app
    ports:
      - 2000:80
    env_file:
      - ./odds-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

  card-service:
    build:
      context: card-service
      dockerfile: Dockerfile
    volumes:
      - ./card-service:/app
    ports:
      - 4500:80
    env_file:
      - ./card-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy


  betting-service:
    build:
      context: betting-service
      dockerfile: Dockerfile
    volumes:
      - ./betting-service:/app
    ports:
      - 7000:80
    env_file:
      - ./betting-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

  bookmaker-service:
    build:
      context: bookmaker-service
      dockerfile: Dockerfile
    volumes:
      - ./bookmaker-service:/app
    ports:
      - 4444:80
    env_file:
      - ./bookmaker-service/.env

  customer-service:
    build:
      context: customer-service
      dockerfile: Dockerfile
    volumes:
      - ./customer-service:/app
    ports:
      - 7050:80
    env_file:
      - ./customer-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy

  notification-service:
    build:
      context: notification-service
      dockerfile: Dockerfile
    volumes:
      - ./notification-service:/app
    env_file:
      - ./notification-service/.env
    networks:
      - tdl
    depends_on:
      postgres-db:
        condition: service_started
      message-broker:
        condition: service_healthy


networks:
  tdl:
    driver: bridge
